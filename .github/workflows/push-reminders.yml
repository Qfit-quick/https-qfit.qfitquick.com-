name: 리마인더 발송(4일·매일)

# 4일 넘게 쉰 기기에 웹푸시를 보내는 send-reminders Edge Function 을
# 하루 한 번 깨운다(2026-09-16 요청). 실제 발송 로직은 전부 Supabase
# 쪽(supabase/functions/send-reminders/index.ts)에 있고, 여기는 그냥
# 정해진 시각에 그 주소를 한 번 부르는 역할만 한다 — 그래서 비밀 값이
# 필요 없다: 호출에 쓰는 anon 키는 어차피 클라이언트 번들에도 있는
# 공개 값이고, devices 테이블 접근 권한(SUPABASE_SERVICE_ROLE_KEY)은
# Edge Function 안에만 있다.

on:
  schedule:
    # 매시 정각(2026-10-04 전엔 하루 한 번 03:00 UTC). 매일 알림이 사용자가
    # 고른 시각(한국 시간)에 맞춰 가야 해서다. 4일 리마인더는 함수 안에서
    # 한국 시간 낮 12시 실행에만 돌므로 예전처럼 하루 한 번이다
    # (supabase/functions/send-reminders/index.ts — 2026-10-04 새 판 배포 확인 후 바꿈).
    - cron: '0 * * * *'
  workflow_dispatch: {} # 배포 직후 수동으로 한 번 눌러 테스트할 수 있게

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: send-reminders Edge Function 호출
        run: |
          curl -sf -X POST \
            "https://pdmjlleaheqyldhitkty.supabase.co/functions/v1/send-reminders" \
            -H "apikey: sb_publishable_dUj4X1NhnU95YihrUzmkWg_kuJGy1eW" \
            -H "Authorization: Bearer sb_publishable_dUj4X1NhnU95YihrUzmkWg_kuJGy1eW" \
            -H "Content-Type: application/json" \
            -o response.json
          cat response.json
